    let tFRU = 0.02, tFRL = -0.04, tFROut = 0.0;
    let tBLU = -0.10, tBLL = 0.14, tBLOut = 0.0;
    let tBRU = -0.10, tBRL = 0.14, tBROut = 0.0;
    let tTailPitch = 0.12, tWagSpeed = 4.5, tWagAmp = 0.25;

    if (state.pose === 'sit') {
      tBodyY = 0.42; tBodyZ = -0.06; tBodyPitch = -0.56;
      tHeadPitch = 0.48; tHeadRoll = 0.12;
      tFLU = 0.50; tFLL = 0.06; tFLOut = 0.04;
      tFRU = 0.50; tFRL = 0.06; tFROut = 0.04;
      // True 2-joint tucked sitting hind legs (thigh forward, shin tucked under!)
      tBLU = -1.22; tBLL = 1.38; tBLOut = 0.26;
      tBRU = -1.22; tBRL = 1.38; tBROut = 0.26;
      tTailPitch = -0.52; tWagSpeed = 4.6; tWagAmp = 0.22;
    } else if (state.pose === 'walk') {
      const cyc = elapsed * 6.8;
      const sA = Math.sin(cyc), sB = Math.sin(cyc + Math.PI);
      tBodyY = 0.52 + Math.abs(Math.sin(cyc)) * 0.032;
      tBodyPitch = Math.sin(cyc * 2) * 0.03;
      tHeadPitch = 0.04 - Math.sin(cyc * 2) * 0.04;
      tFLU = sA * 0.42; tFLL = Math.max(0, -sA) * 0.58;
      tFRU = sB * 0.42; tFRL = Math.max(0, -sB) * 0.58;
      tBLU = sB * 0.40 - 0.08; tBLL = Math.max(0, sB) * 0.52 + 0.12;
      tBRU = sA * 0.40 - 0.08; tBRL = Math.max(0, sA) * 0.52 + 0.12;
      tTailPitch = 0.18; tWagSpeed = 9.0; tWagAmp = 0.34;
    } else if (state.pose === 'lounge') {
      // Cozy lounge on cushions with bent elbows & relaxed front paws (WA0033, WA0016!)
      tBodyY = 0.22; tBodyZ = -0.04; tBodyPitch = 0.04;
      tHeadPitch = -0.02; tHeadRoll = 0.16;
      tFLU = -1.05; tFLL = -0.35; tFLOut = 0.16;
      tFRU = -0.92; tFRL = -0.32; tFROut = 0.24;
      tBLU = 0.72; tBLL = 0.65; tBLOut = 0.55;
      tBRU = 0.80; tBRL = 0.62; tBROut = 0.45;
      tTailPitch = -0.78; tWagSpeed = 2.2; tWagAmp = 0.12;
    } else if (state.pose === 'playbow') {
      // Excited playful bow: elbows down low, rump high up, wagging fast!
      tBodyY = 0.44; tBodyZ = -0.04; tBodyPitch = 0.42;
      tHeadPitch = -0.48; tHeadRoll = -0.08;
      tFLU = -1.35; tFLL = -0.25; tFLOut = 0.22;
      tFRU = -1.35; tFRL = -0.25; tFROut = 0.22;
      tBLU = -0.32; tBLL = 0.18; tBLOut = 0.06;
      tBRU = -0.32; tBRL = 0.18; tBROut = 0.06;
      tTailPitch = 0.35; tWagSpeed = 12.5; tWagAmp = 0.48;
    } else if (state.pose === 'beg') {
      // Sitting tall waving both front paws playfully (WA0015!)
      tBodyY = 0.46; tBodyZ = -0.08; tBodyPitch = -0.78;
      tHeadPitch = 0.65; tHeadRoll = -0.08;
      tFLU = -0.45 + Math.sin(elapsed * 8.5) * 0.20; tFLL = 0.85; tFLOut = 0.14;
      tFRU = -0.45 - Math.sin(elapsed * 8.5) * 0.20; tFRL = 0.85; tFROut = 0.14;
      tBLU = -1.08; tBLL = 1.32; tBLOut = 0.28;
      tBRU = -1.08; tBRL = 1.32; tBROut = 0.28;
      tTailPitch = -0.35; tWagSpeed = 10.5; tWagAmp = 0.40;
    }

    let tPant = (state.expr === 'pant' || state.pose === 'playbow') ? 1 : 0;
    let tBlep = state.expr === 'blep' ? 1 : 0;
    let tEyeClose = state.expr === 'sleepy' ? 0.92 : 0;
    if (state.expr === 'tilt') tHeadRoll = 0.34;
    if (state.expr === 'sleepy') { tHeadPitch += 0.15; tWagSpeed = 1.4; tWagAmp = 0.06; }

    if (state.boopTimer > 0) {
      tBlep = 1.0;
      tHeadPitch -= 0.14 * Math.sin(clamp(state.boopTimer / 1.5, 0, 1) * Math.PI);
      tWagSpeed = 11.5; tWagAmp = 0.42;
    }
    if (state.petTimer > 0) {
      tEyeClose = Math.max(tEyeClose, 0.88);
      tHeadPitch += 0.10;
      tHeadRoll += Math.sin(elapsed * 6.0) * 0.10;
      tWagSpeed = 13.0; tWagAmp = 0.48;
    }
    const barkHop = state.barkTimer > 0 ? Math.abs(Math.sin(state.barkTimer * 14.0)) * 0.12 : 0;
    if (state.barkTimer > 0) { tHeadPitch -= 0.18; tWagSpeed = 12.0; tWagAmp = 0.45; }

    const pal = COAT_PALETTES[state.coat];
    const showCushion = state.cushion && state.scene !== 'swing';
    const tRootY = state.scene === 'swing' ? 0.24 : (showCushion ? 0.275 : 0.0);
    const tCoatScale = state.coat === 'puppycut' ? 0.94 : (state.coat === 'baby2012' ? 0.92 : 1.0);
    const tEarScale = state.coat === 'puppycut' ? 0.78 : (state.coat === 'baby2012' ? 0.86 : 1.02);
    const tPuppyScale = state.coat === 'baby2012' ? 0.84 : 1.0;

    const k = Math.min(1, dt * 8.5);
    rig.rootY = lerp(rig.rootY, tRootY, k);
    rig.bodyY = lerp(rig.bodyY, tBodyY, k);
    rig.bodyZ = lerp(rig.bodyZ, tBodyZ, k);
    rig.bodyPitch = lerp(rig.bodyPitch, tBodyPitch, k);
    rig.headPitch = lerp(rig.headPitch, tHeadPitch, k);
    rig.headRoll = lerp(rig.headRoll, tHeadRoll, k);
    rig.flU = lerp(rig.flU, tFLU, k); rig.flL = lerp(rig.flL, tFLL, k); rig.flOut = lerp(rig.flOut, tFLOut, k);
    rig.frU = lerp(rig.frU, tFRU, k); rig.frL = lerp(rig.frL, tFRL, k); rig.frOut = lerp(rig.frOut, tFROut, k);
    rig.blU = lerp(rig.blU, tBLU, k); rig.blL = lerp(rig.blL, tBLL, k); rig.blOut = lerp(rig.blOut, tBLOut, k);
    rig.brU = lerp(rig.brU, tBRU, k); rig.brL = lerp(rig.brL, tBRL, k); rig.brOut = lerp(rig.brOut, tBROut, k);
    rig.tailPitch = lerp(rig.tailPitch, tTailPitch, k);
    rig.tailWagSpeed = lerp(rig.tailWagSpeed, tWagSpeed, k);
    rig.tailWagAmp = lerp(rig.tailWagAmp, tWagAmp, k);
    rig.pantAmt = lerp(rig.pantAmt, tPant, k);
    rig.blepAmt = lerp(rig.blepAmt, tBlep, k);
    rig.eyeClose = lerp(rig.eyeClose, tEyeClose, k);
    rig.coatScale = lerp(rig.coatScale, tCoatScale, k);
    rig.earScale = lerp(rig.earScale, tEarScale, k);
    rig.puppyScale = lerp(rig.puppyScale, tPuppyScale, k);
    rig.furLength = lerp(rig.furLength, pal.furLength, k);

    const targetLookYaw = cam.hovering ? clamp(cam.pointerX * 0.34, -0.34, 0.34) : Math.sin(elapsed * 0.7) * 0.08;
    const targetLookPitch = cam.hovering ? clamp(-cam.pointerY * 0.18, -0.18, 0.18) : 0;
    rig.headYaw = lerp(rig.headYaw, targetLookYaw, Math.min(1, dt * 5.0));

    // Camera smooth orbit + velocity + unobstructed responsive framing!
    const aspect = canvas.width / Math.max(1, canvas.height);
    const portraitBoost = aspect < 0.9 ? (0.9 - aspect) * 1.45 : 0.0;
    const mobileDrawerUp = (window.innerWidth < 1024 && document.body.classList.contains('drawer-open')) ? -0.34 : 0.0;

    if (state.autoSpin && !isDragging) cam.goalYaw += dt * 0.42;
    cam.prevYaw = cam.yaw;
    cam.yaw = lerp(cam.yaw, cam.goalYaw, Math.min(1, dt * 10));
    cam.pitch = lerp(cam.pitch, cam.goalPitch, Math.min(1, dt * 10));
    cam.dist = lerp(cam.dist, cam.goalDist + portraitBoost, Math.min(1, dt * 10));
    const camElevOffset = (showCushion || state.scene === 'swing') ? 0.16 : 0.0;
    cam.targetY = lerp(cam.targetY, cam.goalTargetY + camElevOffset + mobileDrawerUp, Math.min(1, dt * 8));

    const yawVel = clamp((cam.yaw - cam.prevYaw) / Math.max(dt, 0.008), -4.0, 4.0);
    const bounceImpulse = (state.petTimer > 0 ? 0.16 : 0) + (state.barkTimer > 0 ? 0.24 : 0) + (state.pose === 'walk' ? Math.sin(elapsed * 13.6) * 0.08 : 0);

    // Step second-order damped springs for floppy ears, cord, tail lag & fuzzy fur inertia!
    const earSpringL = stepSpring(springs.earL, 0.14 + bounceImpulse + rig.headRoll * 0.38 - yawVel * 0.06, dt);
    const earSpringR = stepSpring(springs.earR, 0.14 + bounceImpulse - rig.headRoll * 0.38 + yawVel * 0.06, dt);
    const cordSway = stepSpring(springs.cord, -rig.headRoll * 0.85 + yawVel * 0.10, dt);
    const wag = Math.sin(elapsed * rig.tailWagSpeed) * rig.tailWagAmp;
    const tailLag = stepSpring(springs.tailTip, wag, dt);
    stepSpring(springs.furSwayX, clamp(-yawVel * 0.008, -0.02, 0.02), dt);
    stepSpring(springs.furSwayY, clamp(-barkHop * 0.18, -0.025, 0.02), dt);

    const cx = Math.sin(cam.yaw) * Math.cos(cam.pitch) * cam.dist;
    const cy = cam.targetY + Math.sin(cam.pitch) * cam.dist;
    const cz = Math.cos(cam.yaw) * Math.cos(cam.pitch) * cam.dist;
    cam.pos = [cx, cy, cz];

    M4.perspective(projMat, 38 * Math.PI / 180, aspect, 0.1, 35.0);
    M4.lookAt(viewMat, cam.pos, [0, cam.targetY, 0.06], [0, 1, 0]);
    M4.multiply(tmpMat, projMat, viewMat);
    M4.invert(invVP, tmpMat);

    const lp = SCENE_LIGHTING[state.scene];
    const bgCol = isLightTheme ? lp.bgLight : lp.bgDark;

    gl.clearColor(bgCol[0], bgCol[1], bgCol[2], 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

    gl.useProgram(prog);
    gl.uniformMatrix4fv(loc.uProj, false, projMat);
    gl.uniformMatrix4fv(loc.uView, false, viewMat);
    gl.uniform3fv(loc.uCamPos, cam.pos);
    gl.uniform3fv(loc.uKeyDir, lp.keyDir); gl.uniform3fv(loc.uKeyCol, lp.keyCol);
    gl.uniform3fv(loc.uFillDir, lp.fillDir); gl.uniform3fv(loc.uFillCol, lp.fillCol);
    gl.uniform3fv(loc.uRimDir, lp.rimDir); gl.uniform3fv(loc.uRimCol, lp.rimCol);
    gl.uniform3fv(loc.uAmbSky, lp.ambSky); gl.uniform3fv(loc.uAmbGround, lp.ambGround);
    gl.uniform3fv(loc.uBgColor, bgCol);
    gl.uniform1f(loc.uCushionOn, showCushion ? 1.0 : 0.0);
    gl.uniform3f(loc.uShadowPos0, 0.0, 0.0, state.pose === 'lounge' ? 0.65 : 0.54);
    gl.uniform3f(loc.uShadowPos1, 0.54, 0.32, (state.plushie && state.scene !== 'swing') ? 0.24 : 0.0);

    const breath = Math.sin(elapsed * 2.6) * 0.011;

    // 1) Seamless Soft Contact Shadow Plane
    gl.depthMask(false);
    drawMesh(meshes.stage, M4.create(), { matType: 6 });
    gl.depthMask(true);

    // 2) Active 3D Photo Diorama Backdrop!
    const swingRoot = M4.create();
    if (state.scene === 'balcony') {
      drawMesh(meshes.balconyDiorama, M4.create(), { matType: 4, base: [1, 1, 1] });
    } else if (state.scene === 'cozy') {
      drawMesh(meshes.cozyRoom, M4.create(), { matType: 4, base: [1, 1, 1] });
      drawMesh(meshes.cozyLampShade, M4.create(), { matType: 8, base: [0.96, 0.44, 0.36] });
    } else if (state.scene === 'swing') {
      // Gentle swaying outdoor hanging swing motion!
      const sway = Math.sin(elapsed * 1.45) * 0.065;
      M4.translate(swingRoot, swingRoot, 0, 2.35, -0.05);
      M4.rotateZ(swingRoot, swingRoot, sway);
      M4.rotateX(swingRoot, swingRoot, Math.sin(elapsed * 0.9) * 0.025);
      M4.translate(swingRoot, swingRoot, 0, -2.35, 0.05);
      drawMesh(meshes.swingDiorama, swingRoot, { matType: 4, base: [1, 1, 1] });
    }

    // 3) Stacked Maroon Cushions (WA0033)
    if (showCushion) {
      const cushM = M4.create();
      M4.rotateY(cushM, cushM, 0.14);
      drawMesh(meshes.cushions, cushM, { matType: 3, base: [1, 1, 1] });
    }

    // 4) Winnie the Pooh Plushie (WA0025)
    if (state.plushie) {
      const poohM = M4.create();
      if (state.scene === 'swing') M4.copy(poohM, swingRoot);
      const bounceY = Math.sin(state.plushBounce * Math.PI) * 0.18;
      const py = (state.scene === 'swing' ? 0.25 : (showCushion ? 0.285 : 0.0)) + bounceY;
      const px = state.scene === 'swing' ? 0.44 : 0.52;
      const pz = state.scene === 'swing' ? 0.18 : 0.32;
      M4.translate(poohM, poohM, px, py, pz);
      M4.rotateY(poohM, poohM, -0.55 + Math.sin(state.plushBounce * Math.PI * 2) * 0.25);
      M4.rotateZ(poohM, poohM, 0.05);
      drawMesh(meshes.pooh, poohM, { matType: 4, base: [1, 1, 1] });
      hitSpheres.pooh.pos = M4.transformPoint(poohM, 0, 0.18, 0);
    }

    // 5) Hierarchical Articulated HACHI!
    const dogRoot = M4.create();
    if (state.scene === 'swing') M4.copy(dogRoot, swingRoot);
    M4.translate(dogRoot, dogRoot, 0, rig.rootY + barkHop, 0);
    M4.scale(dogRoot, dogRoot, rig.puppyScale, rig.puppyScale, rig.puppyScale);

    const bodyM = M4.create();
    M4.copy(bodyM, dogRoot);
    M4.translate(bodyM, bodyM, 0, rig.bodyY + breath * 0.5, rig.bodyZ);
    M4.rotateX(bodyM, bodyM, rig.bodyPitch);

    const torsoDrawM = M4.create();
    M4.copy(torsoDrawM, bodyM);
    M4.scale(torsoDrawM, torsoDrawM, rig.coatScale * (1 + breath), 1 + breath * 0.8, 1);

    // Volumetric fur shells on torso only when not covered by full shirt/sweater (zero fur poking through fabric!)
    const torsoShells = (state.outfit === 'none' || state.outfit === 'harness') ? SHELL_COUNT : 0;
    drawVolumetricFur(meshes.torso, torsoDrawM, pal, torsoShells, 1.0);
    hitSpheres.body.pos = M4.transformPoint(bodyM, 0, 0.02, 0.0);

    // Outfits
    if (state.outfit !== 'none') {
      const outM = M4.create();
      M4.copy(outM, bodyM);
      M4.scale(outM, outM, 1 + breath * 1.1, 1 + breath * 0.9, 1.0);
      if (state.outfit === 'teal') drawMesh(meshes.shirtTeal, outM, { matType: 3, base: [0.02, 0.58, 0.72] });
      else if (state.outfit === 'mustard') drawMesh(meshes.jacketMustard, outM, { matType: 3, base: [1, 1, 1] });
      else if (state.outfit === 'boo') drawMesh(meshes.shirtBoo, outM, { matType: 3, base: [1, 1, 1], tex: booTexture });
      else if (state.outfit === 'orange') drawMesh(meshes.vestOrange, outM, { matType: 3, base: [0.90, 0.35, 0.14] });
      else if (state.outfit === 'red') drawMesh(meshes.vestRed, outM, { matType: 3, base: [0.74, 0.13, 0.19] });
      else if (state.outfit === 'harness') drawMesh(meshes.harness, outM, { matType: 3, base: [0.76, 0.11, 0.34] });
    }

    // 4 Articulated Two-Joint Fluffy Legs (Shoulder/Hip -> Elbow/Knee -> Paw!)
    const drawArticulatedLeg = (upperMesh, x, y, z, uPitch, lPitch, outRoll) => {
      const upperM = M4.create();
      M4.copy(upperM, bodyM);
      M4.translate(upperM, upperM, x, y, z);
      M4.rotateX(upperM, upperM, uPitch);
      M4.rotateZ(upperM, upperM, outRoll);
      const uDraw = M4.create();
      M4.copy(uDraw, upperM);
      M4.scale(uDraw, uDraw, rig.coatScale, 1, rig.coatScale);
      drawVolumetricFur(upperMesh, uDraw, pal, 14, 0.85, 1.0);

      // Elbow / Knee Joint
      const lowerM = M4.create();
      M4.copy(lowerM, upperM);
      M4.translate(lowerM, lowerM, 0, -0.185, 0);
      M4.rotateX(lowerM, lowerM, lPitch);
      const lDraw = M4.create();
      M4.copy(lDraw, lowerM);
      M4.scale(lDraw, lDraw, rig.coatScale, 1, rig.coatScale);
      drawVolumetricFur(meshes.lowerLeg, lDraw, pal, 14, 0.88, 1.05);

      // Paw Joint (counter-rotates subtly so paws sit flatter on floor/cushion!)
      const pawM = M4.create();
      M4.copy(pawM, lowerM);
      M4.translate(pawM, pawM, 0, -0.225, 0.01);
      const pawLevel = clamp(-(rig.bodyPitch + uPitch + lPitch) * 0.55, -0.55, 0.55);
      M4.rotateX(pawM, pawM, pawLevel);
      drawVolumetricFur(meshes.paw, pawM, pal, 12, 0.72, 0.6);
    };
    drawArticulatedLeg(meshes.upperFront, -0.135, -0.06, 0.22, rig.flU, rig.flL, -rig.flOut);
    drawArticulatedLeg(meshes.upperFront,  0.135, -0.06, 0.22, rig.frU, rig.frL,  rig.frOut);
    drawArticulatedLeg(meshes.upperBack,  -0.145, -0.05, -0.29, rig.blU, rig.blL, -rig.blOut);
    drawArticulatedLeg(meshes.upperBack,   0.145, -0.05, -0.29, rig.brU, rig.brL,  rig.brOut);

    // Plumed Curled Tail with Spring Lag (18 velvety shells + extra lush plume droop!)
    const tailM = M4.create();
    M4.copy(tailM, bodyM);
    M4.translate(tailM, tailM, 0, 0.10, -0.39);
    M4.rotateX(tailM, tailM, rig.tailPitch);
    M4.rotateY(tailM, tailM, tailLag);
    M4.rotateZ(tailM, tailM, tailLag * 0.45);
    drawVolumetricFur(meshes.tailCore, tailM, pal, 18, 1.18, 1.35);

    // Head Group
    const headM = M4.create();
    M4.copy(headM, bodyM);
    M4.translate(headM, headM, 0, 0.265, 0.32);
    M4.rotateY(headM, headM, rig.headYaw);
    M4.rotateX(headM, headM, rig.headPitch + targetLookPitch);
    M4.rotateZ(headM, headM, rig.headRoll);
    const babyHeadBoost = state.coat === 'baby2012' ? 1.12 : 1.0;
    M4.scale(headM, headM, babyHeadBoost, babyHeadBoost, babyHeadBoost);

    const headFurM = M4.create();
    M4.copy(headFurM, headM);
    M4.scale(headFurM, headFurM, rig.coatScale, rig.coatScale * 0.99, rig.coatScale);
    drawVolumetricFur(meshes.headCore, headFurM, pal, SHELL_COUNT, 0.96, 1.05);
    hitSpheres.head.pos = M4.transformPoint(headM, 0, 0.03, 0.05);

    // Natural Drooping Honey-Cream Floppy Ears with Spring Physics (18 velvety combed shells!)
    const earMats = [];
    for (const s of [-1, 1]) {
      const earM = M4.create();
      M4.copy(earM, headM);
      M4.translate(earM, earM, s * 0.195, 0.118, 0.008);
      M4.rotateZ(earM, earM, s * (s < 0 ? earSpringL : earSpringR));
      M4.rotateX(earM, earM, -0.05 + (state.pose === 'walk' ? Math.sin(elapsed * 6.8) * 0.08 : 0));
      M4.scale(earM, earM, s * rig.earScale, rig.earScale, rig.earScale);
      drawVolumetricFur(meshes.earCore, earM, pal, 18, 1.15, 1.65);
      earMats.push(earM);
    }

    // Boopable Wet Heart-Shaped Nose (positioned cleanly proud of muzzle fur shells!)
    const boopSquish = state.boopTimer > 1.05 ? Math.sin(((state.boopTimer - 1.05) / 0.45) * Math.PI) * 0.16 : 0;
    const noseM = M4.create();
    M4.copy(noseM, headM);
    M4.translate(noseM, noseM, 0, -0.010, 0.314 - boopSquish * 0.09);
    M4.scale(noseM, noseM, 1 + boopSquish, 1 - boopSquish * 0.5, 1 - boopSquish);
    drawMesh(meshes.nose, noseM, { matType: 1, base: pal.noseBase, tip: pal.noseTip });
    hitSpheres.nose.pos = M4.transformPoint(headM, 0, -0.010, 0.318);

    // Soulful Glossy Dark Eyes + Soft Dark Eye Rims & Fine Whiskers
    drawMesh(meshes.facialDetails, headM, { matType: 4, base: [1, 1, 1] });
    const closeAmt = Math.max(rig.eyeClose, state.blinkVal);
    for (const s of [-1, 1]) {
      const eyeM = M4.create();
      M4.copy(eyeM, headM);
      M4.translate(eyeM, eyeM, s * 0.098, 0.056, 0.212);
      const eyeSz = state.coat === 'baby2012' ? 1.12 : 1.0;
      M4.scale(eyeM, eyeM, eyeSz, eyeSz, eyeSz);
      drawMesh(meshes.eye, eyeM, { matType: 2, base: [0.035, 0.02, 0.018] });

      if (closeAmt > 0.04) {
        const lidM = M4.create();
        M4.copy(lidM, eyeM);
        M4.rotateX(lidM, lidM, lerp(-1.25, 0.18, closeAmt));
        drawVolumetricFur(meshes.eyelid, lidM, pal, 6, 0.36, 0.4);
      }
    }

    // Dark Lower Lip & Expressions (Pant / Nose Blep / Chew Stick)
    const jawDrop = (rig.pantAmt * 0.028) + (state.barkTimer > 0 ? Math.abs(Math.sin(state.barkTimer * 18)) * 0.050 : 0) + (state.treat ? 0.022 : 0);
    const lipM = M4.create();
    M4.copy(lipM, headM);
    M4.translate(lipM, lipM, 0, -0.090 - jawDrop, 0.258);
    M4.rotateX(lipM, lipM, jawDrop * 3.5);
    drawMesh(meshes.mouthLip, lipM, { matType: 4, base: [1, 1, 1] });

    if (rig.pantAmt > 0.05 && !state.treat) {
      const tM = M4.create();
      M4.copy(tM, headM);
      M4.translate(tM, tM, 0, -0.086 + Math.sin(elapsed * 9.5) * 0.008, 0.248);
      M4.scale(tM, tM, rig.pantAmt, rig.pantAmt, rig.pantAmt);
      drawMesh(meshes.tonguePant, tM, { matType: 4, base: [0.88, 0.36, 0.45] });
    }
    if (rig.blepAmt > 0.05 && !state.treat) {
      const bM = M4.create();
      M4.copy(bM, headM);
      M4.translate(bM, bM, 0, -0.070, 0.270);
      M4.scale(bM, bM, rig.blepAmt, rig.blepAmt, rig.blepAmt);
      drawMesh(meshes.tongueBlep, bM, { matType: 4, base: [0.89, 0.38, 0.47] });
    }
    if (state.treat) {
      const chewM = M4.create();
      M4.copy(chewM, headM);
      const nibble = Math.sin(elapsed * 11.0) * 0.06;
      M4.translate(chewM, chewM, 0.01, -0.084, 0.266);
      M4.rotateX(chewM, chewM, nibble);
      M4.rotateZ(chewM, chewM, -0.15 + nibble * 0.5);
      drawMesh(meshes.chewStick, chewM, { matType: 4, base: [1, 1, 1] });
    }

    // 6) Silky Alpha-Feathered Hair Cards Pass (Ears, Crown Wisps & Plumed Tail!)
    if (pal.showCards) {
      const cardBase = [pal.base[0] * 0.90, pal.base[1] * 0.88, pal.base[2] * 0.85];
      drawMesh(meshes.headHairCards, headFurM, { matType: 7, base: cardBase, tip: pal.tip, tex: hairCardTex, alpha: 0.76 });
      for (const em of earMats) {
        drawMesh(meshes.earHairCards, em, { matType: 7, base: cardBase, tip: pal.tip, tex: hairCardTex, alpha: 0.82 });
      }
      drawMesh(meshes.tailHairCards, tailM, { matType: 7, base: cardBase, tip: pal.tip, tex: hairCardTex, alpha: 0.80 });
    }

    // 7) Stylish Glasses (Frame + Spring-Swaying Cord + Clear Crystal Lenses!)
    if (state.glasses) {
      drawMesh(meshes.glassesFrame, headM, { matType: 4, base: [1, 1, 1] });
      for (const s of [-1, 1]) {
        const cM = M4.create();
        M4.copy(cM, headM);
        M4.translate(cM, cM, s * 0.236, 0.068, 0.138);
        M4.rotateZ(cM, cM, cordSway);
        M4.scale(cM, cM, s, 1, 1);
        drawMesh(meshes.glassesCord, cM, { matType: 4, base: [1, 1, 1] });
      }
      gl.depthMask(false);
      drawMesh(meshes.glassesLens, headM, { matType: 5, base: [0.9, 0.95, 1.0] });
      gl.depthMask(true);
    }

    // 8) Floating 3D Heart Particles
    for (let i = hearts.length - 1; i >= 0; i--) {
      const h = hearts[i];
      h.age += dt;
      if (h.age >= h.life) { hearts.splice(i, 1); continue; }
      h.x += h.vx * dt; h.y += h.vy * dt; h.z += h.vz * dt;
      const p = h.age / h.life;
      const alpha = p < 0.2 ? p / 0.2 : 1.0 - (p - 0.2) / 0.8;
      const hm = M4.create();
      M4.translate(hm, hm, h.x, h.y, h.z);
      M4.rotateY(hm, hm, cam.yaw + Math.sin(elapsed * 5 + i) * 0.3);
      const sc = h.scale * (0.7 + 0.4 * Math.sin(p * Math.PI));
      M4.scale(hm, hm, sc, sc, sc);
      drawMesh(meshes.heart, hm, { matType: 4, base: h.color, alpha });
    }

    requestAnimationFrame(renderFrame);
  }
  requestAnimationFrame(renderFrame);

  // =========================================================================
  // 9. One-Tap Photo Booth Postcard Exporter!
  // =========================================================================
  function takePostcardPhoto() {
    const layer = document.getElementById('reactionLayer');
    const flash = document.createElement('div');
    flash.className = 'camera-flash absolute inset-0 bg-white z-20';
    layer.appendChild(flash);
    setTimeout(() => flash.remove(), 480);

    try {
      const pad = 28;
      const footerH = 68;
      const w = canvas.width;
      const h = canvas.height;
      const out = document.createElement('canvas');
      out.width = w + pad * 2;
      out.height = h + pad + footerH;
      const ctx = out.getContext('2d');

      // Warm Polaroid postcard frame
      ctx.fillStyle = '#fffdf9';
      ctx.fillRect(0, 0, out.width, out.height);
      ctx.drawImage(canvas, pad, pad, w, h);

      // Subtle inner border around photo
      ctx.strokeStyle = 'rgba(35, 29, 24, 0.08)';
      ctx.lineWidth = 2;
      ctx.strokeRect(pad, pad, w, h);

      // Name & caption footer
      const name = (document.getElementById('dogNameInput').value || 'Hachi').trim();
      const mood = document.getElementById('moodBadge').textContent.trim();
      ctx.fillStyle = '#231d18';
      ctx.font = `700 ${Math.max(20, Math.round(out.width * 0.028))}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
      ctx.fillText(`🐾 ${name}`, pad + 6, h + pad + 44);

      ctx.fillStyle = '#7c7065';
      ctx.font = `500 ${Math.max(14, Math.round(out.width * 0.018))}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
      const rightTxt = `${mood}  ·  3D Studio`;
      const tw = ctx.measureText(rightTxt).width;
      ctx.fillText(rightTxt, out.width - pad - tw - 6, h + pad + 43);

      const url = out.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = url;
      a.download = `${name.toLowerCase().replace(/[^a-z0-9]+/g, '-') || 'hachi'}-3d-photo.png`;
      document.body.appendChild(a);
      a.click();
      a.remove();

      const rect = canvas.getBoundingClientRect();
      showBubble('📸 Postcard Saved!', rect.width * 0.5, rect.height * 0.25);
    } catch (err) {
      console.error('Photo export failed:', err);
    }
  }

  // =========================================================================
  // 10. Pointer Orbit, Zoom, Pinch & Exact 3D Raycasted Boop/Pet Interactions
  // =========================================================================
  let lastX = 0, lastY = 0, dragMoved = 0;

  function showBubble(text, screenX, screenY) {
    const layer = document.getElementById('reactionLayer');
    const el = document.createElement('div');
    el.className = 'speech-bubble absolute px-3 py-1 rounded-full bg-[var(--card)]/95 border border-[var(--border)] text-xs font-semibold text-[var(--foreground)] shadow-md whitespace-nowrap';
    el.style.left = `${screenX}px`; el.style.top = `${screenY}px`;
    el.textContent = text;
    layer.appendChild(el);
    setTimeout(() => el.remove(), 1700);
  }

  function setMood(text) { document.getElementById('moodBadge').textContent = text; }

  function triggerBoop(sx, sy) {
    state.boops++; state.boopTimer = 1.5;
    document.getElementById('boopCount').textContent = state.boops;
    setMood('Booped! 🐾');
    spawnHearts(hitSpheres.nose.pos, 5);
    playCuteSound('boop');
    const rect = canvas.getBoundingClientRect();
    showBubble('Boop! 👅', sx ?? rect.width * 0.5, sy ?? rect.height * 0.36);
  }

  function triggerPet(sx, sy) {
    state.pets++; state.petTimer = 2.0;
    document.getElementById('petCount').textContent = state.pets;
    setMood('Blissful Pets 💛');
    spawnHearts(hitSpheres.head.pos, 6);
    playCuteSound('pet');
    const rect = canvas.getBoundingClientRect();
    const nm = document.getElementById('dogNameInput').value || 'Hachi';
    showBubble(`Good girl, ${nm}! 💛`, sx ?? rect.width * 0.5, sy ?? rect.height * 0.30);
  }

  function triggerBark() {
    state.barkTimer = 0.85;
    setMood('Arf! Arf! 🐾');
    spawnHearts(hitSpheres.head.pos, 3);
    playCuteSound('bark');
    const rect = canvas.getBoundingClientRect();
    const lines = ['Arf! 🐾', 'Woof! 💕', 'Treat pls! 🦴', 'Play? 🧸'];
    showBubble(lines[Math.floor(Math.random() * lines.length)], rect.width * 0.52, rect.height * 0.28);
  }

  function rayHitsSphere(orig, dir, center, r) {
    const ocx = orig[0] - center[0], ocy = orig[1] - center[1], ocz = orig[2] - center[2];
    const b = ocx * dir[0] + ocy * dir[1] + ocz * dir[2];
    const c = ocx * ocx + ocy * ocy + ocz * ocz - r * r;
    const disc = b * b - c;
    if (disc < 0) return -1;
    const t = -b - Math.sqrt(disc);
    return t > 0 ? t : -1;
  }

  function pickAtClient(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const nx = ((clientX - rect.left) / rect.width) * 2 - 1;
    const ny = 1 - ((clientY - rect.top) / rect.height) * 2;
    const unproj = (z) => {
      const x = invVP[0]*nx + invVP[4]*ny + invVP[8]*z + invVP[12];
      const y = invVP[1]*nx + invVP[5]*ny + invVP[9]*z + invVP[13];
      const zz = invVP[2]*nx + invVP[6]*ny + invVP[10]*z + invVP[14];
      const w = invVP[3]*nx + invVP[7]*ny + invVP[11]*z + invVP[15] || 1;
      return [x/w, y/w, zz/w];
    };
    const pNear = unproj(-1), pFar = unproj(1);
    let dx = pFar[0] - pNear[0], dy = pFar[1] - pNear[1], dz = pFar[2] - pNear[2];
    const dl = Math.hypot(dx, dy, dz) || 1;
    const dir = [dx/dl, dy/dl, dz/dl];
    const sx = clientX - rect.left, sy = clientY - rect.top;

    if (rayHitsSphere(pNear, dir, hitSpheres.nose.pos, hitSpheres.nose.r) > 0) { triggerBoop(sx, sy); return; }
    if (rayHitsSphere(pNear, dir, hitSpheres.head.pos, hitSpheres.head.r) > 0) { triggerPet(sx, sy); return; }
    if (state.plushie && rayHitsSphere(pNear, dir, hitSpheres.pooh.pos, hitSpheres.pooh.r) > 0) {
      state.plushBounce = 1.0; playCuteSound('boop'); showBubble('Squeak! 🧸', sx, sy); return;
    }
    if (rayHitsSphere(pNear, dir, hitSpheres.body.pos, hitSpheres.body.r) > 0) { triggerPet(sx, sy); }
  }

  canvas.addEventListener('pointerdown', (e) => {
    isDragging = true; lastX = e.clientX; lastY = e.clientY; dragMoved = 0;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', (e) => {
    const rect = canvas.getBoundingClientRect();
    cam.pointerX = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    cam.pointerY = ((e.clientY - rect.top) / rect.height) * 2 - 1;
    cam.hovering = true;
    if (!isDragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    dragMoved += Math.hypot(dx, dy);
    cam.goalYaw -= dx * 0.0085;
    cam.goalPitch = clamp(cam.goalPitch + dy * 0.0068, -0.18, 1.15);
  });
  canvas.addEventListener('pointerup', (e) => {
    if (isDragging && dragMoved < 7) pickAtClient(e.clientX, e.clientY);
    isDragging = false;
  });
  canvas.addEventListener('pointerleave', () => { cam.hovering = false; });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    cam.goalDist = clamp(cam.goalDist + e.deltaY * 0.0022, 1.35, 5.2);
  }, { passive: false });

  // Mobile two-finger pinch zoom
  let pinchStartDist = 0, pinchStartCam = 0;
  canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      pinchStartDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      pinchStartCam = cam.goalDist;
    }
  }, { passive: true });
  canvas.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2 && pinchStartDist > 0) {
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      cam.goalDist = clamp(pinchStartCam * (pinchStartDist / Math.max(10, d)), 1.35, 5.2);
    }
  }, { passive: true });

  // =========================================================================
  // 11. Studio UI Binding
  // =========================================================================
  function styleRadioGroup(containerId, attr, currentVal) {
    document.querySelectorAll(`#${containerId} button`).forEach((b) => {
      const active = b.getAttribute(attr) === currentVal;
      b.classList.toggle('bg-[var(--primary)]', active);
      b.classList.toggle('text-[var(--primary-foreground)]', active);
      b.classList.toggle('border-[var(--primary)]', active);
      b.classList.toggle('bg-[var(--background)]/60', !active);
      b.classList.toggle('text-[var(--foreground)]', !active);
      b.classList.toggle('border-[var(--border)]', !active);
    });
  }

  function styleToggleBtn(id, active) {
    const b = document.getElementById(id);
    b.classList.toggle('bg-[var(--primary)]', active);
    b.classList.toggle('text-[var(--primary-foreground)]', active);
    b.classList.toggle('border-[var(--primary)]', active);
    b.classList.toggle('bg-[var(--background)]/60', !active);
    b.classList.toggle('text-[var(--foreground)]', !active);
    b.classList.toggle('border-[var(--border)]', !active);
    const dot = b.querySelector('.state-dot');
    if (dot) dot.textContent = active ? 'On' : 'Off';
  }

  function refreshUI() {
    styleRadioGroup('sceneGroup', 'data-scene', state.scene);
    styleRadioGroup('poseGroup', 'data-pose', state.pose);
    styleRadioGroup('exprGroup', 'data-expr', state.expr);
    styleRadioGroup('coatGroup', 'data-coat', state.coat);
    styleRadioGroup('outfitGroup', 'data-outfit', state.outfit);
    styleToggleBtn('togGlasses', state.glasses);
    styleToggleBtn('togPlushie', state.plushie);
    styleToggleBtn('togCushion', state.cushion);
    styleToggleBtn('togTreat', state.treat);
    document.getElementById('spinToggleBtn').textContent = state.autoSpin ? 'Spin: On' : 'Spin: Off';
    document.getElementById('actSound').textContent = state.soundOn ? '🔊' : '🔈';
  }

  document.querySelectorAll('#sceneGroup button').forEach(b => b.addEventListener('click', () => {
    state.scene = b.getAttribute('data-scene');
    if (state.scene === 'swing' && (state.pose === 'walk' || state.pose === 'playbow')) state.pose = 'sit';
    setMood({ balcony: 'Sunny Balcony 🌿', cozy: 'Cozy Lamp Room 🛋️', swing: 'Garden Swing 🧺', studio: 'Portrait Studio ✨' }[state.scene]);
    refreshUI();
  }));
  document.querySelectorAll('#poseGroup button').forEach(b => b.addEventListener('click', () => {
    state.pose = b.getAttribute('data-pose');
    setMood({ sit: 'Good Girl Sitting', stand: 'Ready to Walk', walk: 'Happy Trot 🐾', lounge: 'Cozy Nap', playbow: 'Playtime Bow!', beg: 'Begging for Treats!' }[state.pose]);
    refreshUI();
  }));
  document.querySelectorAll('#exprGroup button').forEach(b => b.addEventListener('click', () => { state.expr = b.getAttribute('data-expr'); refreshUI(); }));
  document.querySelectorAll('#coatGroup button').forEach(b => b.addEventListener('click', () => {
    state.coat = b.getAttribute('data-coat');
    setMood(state.coat === 'baby2012' ? 'Sept 2012 Baby Hachi 💛' : 'Freshly Fluffed ✨');
    refreshUI();
  }));
  document.querySelectorAll('#outfitGroup button').forEach(b => b.addEventListener('click', () => { state.outfit = b.getAttribute('data-outfit'); refreshUI(); }));

  document.getElementById('togGlasses').addEventListener('click', () => { state.glasses = !state.glasses; refreshUI(); });
  document.getElementById('togPlushie').addEventListener('click', () => { state.plushie = !state.plushie; refreshUI(); });
  document.getElementById('togCushion').addEventListener('click', () => { state.cushion = !state.cushion; refreshUI(); });
  document.getElementById('togTreat').addEventListener('click', () => {
    state.treat = !state.treat;
    if (state.treat) setMood('Munching Treat 🥩');
    refreshUI();
  });

  document.getElementById('actBoop').addEventListener('click', () => triggerBoop());
  document.getElementById('actPet').addEventListener('click', () => triggerPet());
  document.getElementById('actTreat').addEventListener('click', () => {
    state.treat = !state.treat;
    if (state.treat) {
      setMood('Yummy Jerky! 🥩');
      spawnHearts(hitSpheres.head.pos, 4);
      const rect = canvas.getBoundingClientRect();
      showBubble('Nom nom! 🥩', rect.width * 0.5, rect.height * 0.34);
    }
    refreshUI();
  });
  document.getElementById('actBark').addEventListener('click', triggerBark);
  document.getElementById('actSound').addEventListener('click', () => {
    state.soundOn = !state.soundOn;
    if (state.soundOn) playCuteSound('boop');
    refreshUI();
  });
  document.getElementById('snapPhotoBtn').addEventListener('click', takePostcardPhoto);

  document.getElementById('camFaceBtn').addEventListener('click', () => {
    cam.goalYaw = 0.22; cam.goalPitch = 0.14; cam.goalDist = 1.62; cam.goalTargetY = 0.88;
  });
  document.getElementById('camFullBtn').addEventListener('click', () => {
    cam.goalYaw = 0.34; cam.goalPitch = 0.20; cam.goalDist = 3.15; cam.goalTargetY = 0.72;
  });
  document.getElementById('spinToggleBtn').addEventListener('click', () => { state.autoSpin = !state.autoSpin; refreshUI(); });
  document.getElementById('resetAllBtn').addEventListener('click', () => {
    state.scene = 'balcony'; state.pose = 'sit'; state.expr = 'sweet'; state.coat = 'shaggy';
    state.outfit = 'none'; state.glasses = false; state.plushie = true; state.cushion = true;
    state.treat = false; state.autoSpin = false;
    cam.goalYaw = 0.34; cam.goalPitch = 0.20; cam.goalDist = 3.15; cam.goalTargetY = 0.72;
    setMood('Happy');
    refreshUI();
  });

  // Collapsible Studio Drawer (closed by default on mobile/narrow screens so Hachi is 100% unobstructed!)
  const toggleDrawerBtn = document.getElementById('toggleDrawerBtn');
  const closeDrawerBtn = document.getElementById('closeDrawerBtn');
  function setDrawerOpen(open) {
    document.body.classList.toggle('drawer-open', open);
    document.body.classList.toggle('drawer-closed', !open);
    if (toggleDrawerBtn) toggleDrawerBtn.textContent = open ? '✕ Hide' : '✨ Menu';
    setTimeout(resizeCanvas, 20);
  }
  if (toggleDrawerBtn) {
    toggleDrawerBtn.addEventListener('click', () => {
      setDrawerOpen(!document.body.classList.contains('drawer-open'));
    });
  }
  if (closeDrawerBtn) {
    closeDrawerBtn.addEventListener('click', () => setDrawerOpen(false));
  }
  // Open sidebar by default only on wide desktops (>= 1024px); keep 100% full-screen Hachi on mobile & narrow panes!
  setDrawerOpen(window.innerWidth >= 1024);

  refreshUI();
})();
</script>

      rimDir: [0.25, 0.68, -0.92],
      rimCol: [1.02, 0.76, 0.54],
      ambSky: [0.86, 0.77, 0.69],
      ambGround: [0.46, 0.34, 0.30],
      bgLight: [0.95, 0.90, 0.85],
      bgDark:  [0.12, 0.11, 0.14],
    },
    studio: {
      keyDir: [0.55, 0.92, 0.85],
      keyCol: [1.02, 1.01, 1.00],
      fillDir: [-0.80, 0.45, 0.55],
      fillCol: [0.86, 0.90, 0.96],
      rimDir: [0.0, 0.82, -1.0],
      rimCol: [0.98, 0.99, 1.04],
      ambSky: [0.94, 0.95, 0.98],
      ambGround: [0.56, 0.55, 0.56],
      bgLight: [0.95, 0.96, 0.97],
      bgDark:  [0.12, 0.13, 0.15],
    }
  };

  const hearts = [];
  function spawnHearts(worldPos, count = 4) {
    for (let i = 0; i < count; i++) {
      hearts.push({
        x: worldPos[0] + (Math.random() - 0.5) * 0.28,
        y: worldPos[1] + 0.08 + Math.random() * 0.12,
        z: worldPos[2] + (Math.random() - 0.5) * 0.22,
        vx: (Math.random() - 0.5) * 0.18,
        vy: 0.42 + Math.random() * 0.28,
        vz: (Math.random() - 0.5) * 0.16,
        age: 0,
        life: 1.15 + Math.random() * 0.45,
        scale: 0.55 + Math.random() * 0.45,
        color: i % 2 === 0 ? [0.95, 0.36, 0.48] : [0.99, 0.65, 0.42]
      });
    }
  }

  let audioCtx = null;
  function playCuteSound(type) {
    if (!state.soundOn) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      if (type === 'boop') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(790, now + 0.09);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
        osc.start(now); osc.stop(now + 0.15);
      } else if (type === 'bark') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(420, now);
        osc.frequency.exponentialRampToValueAtTime(680, now + 0.06);
        osc.frequency.exponentialRampToValueAtTime(340, now + 0.16);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.start(now); osc.stop(now + 0.19);
      } else if (type === 'pet') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(340, now);
        osc.frequency.exponentialRampToValueAtTime(440, now + 0.18);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        osc.start(now); osc.stop(now + 0.23);
      }
    } catch (_) {}
  }

  const hitSpheres = {
    nose: { pos: [0, 1.0, 0.5], r: 0.15 },
    head: { pos: [0, 1.0, 0.3], r: 0.35 },
    body: { pos: [0, 0.6, 0.0], r: 0.42 },
    pooh: { pos: [0.54, 0.4, 0.32], r: 0.24 },
  };

  // =========================================================================
  // 7. Rendering Pipeline & Theme Sync
  // =========================================================================
  const projMat = M4.create();
  const viewMat = M4.create();
  const normMat = new Float32Array(9);
  const invVP = M4.create();
  const tmpMat = M4.create();

  function drawMesh(mesh, modelMat, opts) {
    gl.uniformMatrix4fv(loc.uModel, false, modelMat);
    M4.normalMat3(normMat, modelMat);
    gl.uniformMatrix3fv(loc.uNormalMat, false, normMat);

    const base = opts.base || [1, 1, 1];
    const tip = opts.tip || base;
    gl.uniform3f(loc.uBaseColor, base[0], base[1], base[2]);
    gl.uniform3f(loc.uTipColor, tip[0], tip[1], tip[2]);
    gl.uniform1i(loc.uMatType, opts.matType ?? 4);
    gl.uniform1f(loc.uFurScale, opts.furScale ?? 16.0);
    gl.uniform1f(loc.uAlpha, opts.alpha ?? 1.0);
    gl.uniform1f(loc.uUseTex, opts.tex ? 1.0 : 0.0);
    if (opts.tex) {
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, opts.tex);
      gl.uniform1i(loc.uTex, 0);
    }

    gl.bindBuffer(gl.ARRAY_BUFFER, mesh.posBuf);
    gl.enableVertexAttribArray(loc.aPos);
    gl.vertexAttribPointer(loc.aPos, 3, gl.FLOAT, false, 0, 0);

    gl.bindBuffer(gl.ARRAY_BUFFER, mesh.normBuf);
    gl.enableVertexAttribArray(loc.aNorm);
    gl.vertexAttribPointer(loc.aNorm, 3, gl.FLOAT, false, 0, 0);

    gl.bindBuffer(gl.ARRAY_BUFFER, mesh.uvBuf);
    gl.enableVertexAttribArray(loc.aUV);
    gl.vertexAttribPointer(loc.aUV, 2, gl.FLOAT, false, 0, 0);

    gl.bindBuffer(gl.ARRAY_BUFFER, mesh.colBuf);
    gl.enableVertexAttribArray(loc.aColor);
    gl.vertexAttribPointer(loc.aColor, 3, gl.FLOAT, false, 0, 0);

    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, mesh.idxBuf);
    gl.drawElements(gl.TRIANGLES, mesh.count, gl.UNSIGNED_SHORT, 0);
  }

  let isLightTheme = true;
  function syncTheme() {
    if (document.documentElement.classList.contains('light')) { isLightTheme = true; return; }
    if (document.documentElement.classList.contains('dark')) { isLightTheme = false; return; }
    const bg = getComputedStyle(document.body).backgroundColor;
    const m = bg && bg.match(/[\d.]+/g);
    if (m && m.length >= 3 && (m.length < 4 || parseFloat(m[3]) > 0.05)) {
      const lum = (0.299 * +m[0] + 0.587 * +m[1] + 0.114 * +m[2]) / 255;
      isLightTheme = lum > 0.5;
    } else if (window.matchMedia) {
      isLightTheme = !window.matchMedia('(prefers-color-scheme: dark)').matches;
    }
  }
  syncTheme();
  window.addEventListener('themechange', syncTheme);

  function resizeCanvas() {
    const rect = canvas.parentElement.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.floor(rect.width * dpr));
    const h = Math.max(1, Math.floor(rect.height * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  let isDragging = false;
  let lastT = performance.now();
  let elapsed = 0;

  // =========================================================================
  // 8. Animation Loop & Hierarchical Doggy Rendering
  // =========================================================================
  function renderFrame(now) {
    const dt = Math.min(0.05, Math.max(0.001, (now - lastT) / 1000));
    lastT = now;
    elapsed += dt;
    resizeCanvas();

    state.boopTimer = Math.max(0, state.boopTimer - dt);
    state.petTimer = Math.max(0, state.petTimer - dt);
    state.barkTimer = Math.max(0, state.barkTimer - dt);
    state.plushBounce = Math.max(0, state.plushBounce - dt * 2.2);

    state.blinkTimer -= dt;
    if (state.blinkTimer <= 0) {
      state.blinkTimer = 2.6 + Math.random() * 3.2;
      state.blinkVal = 1.0;
    }
    state.blinkVal = Math.max(0, state.blinkVal - dt * 6.5);

    let tBodyY = 0.56, tBodyZ = -0.05, tBodyPitch = 0.0;
    let tHeadPitch = 0.04, tHeadRoll = 0.0;
    let tFL = 0.0, tFR = 0.0, tFLOut = 0.0, tFROut = 0.0;
    let tBL = 0.0, tBR = 0.0, tBLOut = 0.0, tBROut = 0.0;
    let tTailPitch = 0.10, tWagSpeed = 4.2, tWagAmp = 0.25;

    if (state.pose === 'sit') {
      tBodyY = 0.43; tBodyZ = -0.06; tBodyPitch = -0.58;
      tHeadPitch = 0.50; tHeadRoll = 0.12;
      tFL = 0.56; tFR = 0.56; tFLOut = 0.05; tFROut = 0.05;
      tBL = -0.92; tBR = -0.92; tBLOut = 0.26; tBROut = 0.26;
      tTailPitch = -0.55; tWagSpeed = 4.5; tWagAmp = 0.22;
    } else if (state.pose === 'lounge') {
      tBodyY = 0.23; tBodyZ = -0.04; tBodyPitch = 0.04;
      tHeadPitch = -0.03; tHeadRoll = 0.16;
      tFL = -1.32; tFR = -1.16; tFLOut = 0.18; tFROut = 0.26;
      tBL = 1.15; tBR = 1.25; tBLOut = 0.52; tBROut = 0.42;
      tTailPitch = -0.78; tWagSpeed = 2.2; tWagAmp = 0.12;
    } else if (state.pose === 'playful') {
      tBodyY = 0.47; tBodyZ = -0.08; tBodyPitch = -0.76;
      tHeadPitch = 0.62; tHeadRoll = -0.10;
      tFL = -0.45 + Math.sin(elapsed * 8.5) * 0.22;
      tFR = -0.45 - Math.sin(elapsed * 8.5) * 0.22;
      tFLOut = 0.14; tFROut = 0.14;
      tBL = -0.82; tBR = -0.82; tBLOut = 0.28; tBROut = 0.28;
      tTailPitch = -0.35; tWagSpeed = 10.0; tWagAmp = 0.40;
    }

    let tPant = state.expr === 'pant' ? 1 : 0;
    let tBlep = state.expr === 'blep' ? 1 : 0;
    let tEyeClose = state.expr === 'sleepy' ? 0.92 : 0;
    if (state.expr === 'tilt') tHeadRoll = 0.34;
    if (state.expr === 'sleepy') { tHeadPitch += 0.16; tWagSpeed = 1.4; tWagAmp = 0.06; }

    if (state.boopTimer > 0) {
      tBlep = 1.0;
      tHeadPitch -= 0.14 * Math.sin(clamp(state.boopTimer / 1.5, 0, 1) * Math.PI);
      tWagSpeed = 11.5; tWagAmp = 0.42;
    }
    if (state.petTimer > 0) {
      tEyeClose = Math.max(tEyeClose, 0.88);
      tHeadPitch += 0.10;
      tHeadRoll += Math.sin(elapsed * 6.0) * 0.10;
      tWagSpeed = 13.0; tWagAmp = 0.48;
    }
    const barkHop = state.barkTimer > 0 ? Math.abs(Math.sin(state.barkTimer * 14.0)) * 0.12 : 0;
    if (state.barkTimer > 0) {
      tHeadPitch -= 0.18;
      tWagSpeed = 12.0; tWagAmp = 0.45;
    }

    const tRootY = state.cushion ? 0.275 : 0.0;
    const tCoatScale = state.coat === 'puppycut' ? 0.93 : (state.coat === 'baby2012' ? 0.91 : 1.0);
    const tEarScale = state.coat === 'puppycut' ? 0.78 : (state.coat === 'baby2012' ? 0.86 : 1.03);
    const tPuppyScale = state.coat === 'baby2012' ? 0.84 : 1.0;

    const k = Math.min(1, dt * 8.5);
    rig.rootY = lerp(rig.rootY, tRootY, k);
    rig.bodyY = lerp(rig.bodyY, tBodyY, k);
    rig.bodyZ = lerp(rig.bodyZ, tBodyZ, k);
    rig.bodyPitch = lerp(rig.bodyPitch, tBodyPitch, k);
    rig.headPitch = lerp(rig.headPitch, tHeadPitch, k);
    rig.headRoll = lerp(rig.headRoll, tHeadRoll, k);
    rig.flPitch = lerp(rig.flPitch, tFL, k);
    rig.frPitch = lerp(rig.frPitch, tFR, k);
    rig.flOut = lerp(rig.flOut, tFLOut, k);
    rig.frOut = lerp(rig.frOut, tFROut, k);
    rig.blPitch = lerp(rig.blPitch, tBL, k);
    rig.brPitch = lerp(rig.brPitch, tBR, k);
    rig.blOut = lerp(rig.blOut, tBLOut, k);
    rig.brOut = lerp(rig.brOut, tBROut, k);
    rig.tailPitch = lerp(rig.tailPitch, tTailPitch, k);
    rig.tailWagSpeed = lerp(rig.tailWagSpeed, tWagSpeed, k);
    rig.tailWagAmp = lerp(rig.tailWagAmp, tWagAmp, k);
    rig.pantAmt = lerp(rig.pantAmt, tPant, k);
    rig.blepAmt = lerp(rig.blepAmt, tBlep, k);
    rig.eyeClose = lerp(rig.eyeClose, tEyeClose, k);
    rig.coatScale = lerp(rig.coatScale, tCoatScale, k);
    rig.earScale = lerp(rig.earScale, tEarScale, k);
    rig.puppyScale = lerp(rig.puppyScale, tPuppyScale, k);

    const targetLookYaw = cam.hovering ? clamp(cam.pointerX * 0.34, -0.34, 0.34) : Math.sin(elapsed * 0.7) * 0.08;
    const targetLookPitch = cam.hovering ? clamp(-cam.pointerY * 0.20, -0.20, 0.20) : 0;
    rig.headYaw = lerp(rig.headYaw, targetLookYaw, Math.min(1, dt * 5.0));

    if (state.autoSpin && !isDragging) cam.goalYaw += dt * 0.42;
    cam.yaw = lerp(cam.yaw, cam.goalYaw, Math.min(1, dt * 10));
    cam.pitch = lerp(cam.pitch, cam.goalPitch, Math.min(1, dt * 10));
    cam.dist = lerp(cam.dist, cam.goalDist, Math.min(1, dt * 10));
    cam.targetY = lerp(cam.targetY, cam.goalTargetY + (state.cushion ? 0.16 : 0.0), Math.min(1, dt * 8));

    const cx = Math.sin(cam.yaw) * Math.cos(cam.pitch) * cam.dist;
    const cy = cam.targetY + Math.sin(cam.pitch) * cam.dist;
    const cz = Math.cos(cam.yaw) * Math.cos(cam.pitch) * cam.dist;
    cam.pos = [cx, cy, cz];

    const aspect = canvas.width / Math.max(1, canvas.height);
    M4.perspective(projMat, 38 * Math.PI / 180, aspect, 0.1, 30.0);
    M4.lookAt(viewMat, cam.pos, [0, cam.targetY, 0.06], [0, 1, 0]);
    M4.multiply(tmpMat, projMat, viewMat);
    M4.invert(invVP, tmpMat);

    const lp = LIGHT_PRESETS[state.lighting];
    const bgCol = isLightTheme ? lp.bgLight : lp.bgDark;

    gl.clearColor(bgCol[0], bgCol[1], bgCol[2], 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

    gl.useProgram(prog);
    gl.uniformMatrix4fv(loc.uProj, false, projMat);
    gl.uniformMatrix4fv(loc.uView, false, viewMat);
    gl.uniform3fv(loc.uCamPos, cam.pos);
    gl.uniform3fv(loc.uKeyDir, lp.keyDir);
    gl.uniform3fv(loc.uKeyCol, lp.keyCol);
    gl.uniform3fv(loc.uFillDir, lp.fillDir);
    gl.uniform3fv(loc.uFillCol, lp.fillCol);
    gl.uniform3fv(loc.uRimDir, lp.rimDir);
    gl.uniform3fv(loc.uRimCol, lp.rimCol);
    gl.uniform3fv(loc.uAmbSky, lp.ambSky);
    gl.uniform3fv(loc.uAmbGround, lp.ambGround);
    gl.uniform3fv(loc.uBgColor, bgCol);
    gl.uniform1f(loc.uCushionOn, state.cushion ? 1.0 : 0.0);
    gl.uniform3f(loc.uShadowPos0, 0.0, 0.0, state.pose === 'lounge' ? 0.65 : 0.52);
    gl.uniform3f(loc.uShadowPos1, 0.54, 0.32, state.plushie ? 0.24 : 0.0);

    const pal = COAT_PALETTES[state.coat];
    const breath = Math.sin(elapsed * 2.6) * 0.012;
    const wag = Math.sin(elapsed * rig.tailWagSpeed) * rig.tailWagAmp;

    // 1) Seamless Soft Contact Shadow Plane
    gl.depthMask(false);
    drawMesh(meshes.stage, M4.create(), { matType: 6 });
    gl.depthMask(true);

    // 2) Stacked Maroon Cushions (WA0033)
    if (state.cushion) {
      const cushM = M4.create();
      M4.rotateY(cushM, cushM, 0.14);
      drawMesh(meshes.cushions, cushM, { matType: 3, base: [1, 1, 1] });
    }

    // 3) Winnie the Pooh Plushie (WA0025)
    if (state.plushie) {
      const poohM = M4.create();
      const bounceY = Math.sin(state.plushBounce * Math.PI) * 0.18;
      const py = (state.cushion ? 0.285 : 0.0) + bounceY;
      M4.translate(poohM, poohM, 0.52, py, 0.32);
      M4.rotateY(poohM, poohM, -0.55 + Math.sin(state.plushBounce * Math.PI * 2) * 0.25);
      M4.rotateZ(poohM, poohM, 0.05);
      drawMesh(meshes.pooh, poohM, { matType: 4, base: [1, 1, 1] });
      hitSpheres.pooh.pos = [0.52, py + 0.18, 0.32];
    }

    // 4) Hierarchical Doggy
    const dogRoot = M4.create();
    M4.translate(dogRoot, dogRoot, 0, rig.rootY + barkHop, 0);
    M4.scale(dogRoot, dogRoot, rig.puppyScale, rig.puppyScale, rig.puppyScale);

    const bodyM = M4.create();
    M4.copy(bodyM, dogRoot);
    M4.translate(bodyM, bodyM, 0, rig.bodyY + breath * 0.5, rig.bodyZ);
    M4.rotateX(bodyM, bodyM, rig.bodyPitch);

    const torsoDrawM = M4.create();
    M4.copy(torsoDrawM, bodyM);
    M4.scale(torsoDrawM, torsoDrawM, rig.coatScale * (1 + breath), 1 + breath * 0.8, 1);
    drawMesh(meshes.torsoBase, torsoDrawM, {
      matType: 0, base: pal.base, tip: pal.tip, furScale: pal.furScale
    });
    // Only draw outer torso curls when wearing Natural Coat or Harness (zero clipping through sweaters!)
    if (state.outfit === 'none' || state.outfit === 'harness') {
      drawMesh(meshes.torsoCurls, torsoDrawM, {
        matType: 0, base: pal.base, tip: pal.tip, furScale: pal.furScale
      });
    }
    hitSpheres.body.pos = M4.transformPoint(bodyM, 0, 0.02, 0.0);

    // Outfits
    if (state.outfit !== 'none') {
      const outM = M4.create();
      M4.copy(outM, bodyM);
      M4.scale(outM, outM, 1 + breath * 1.1, 1 + breath * 0.9, 1.0);
      if (state.outfit === 'teal') {
        drawMesh(meshes.shirtTeal, outM, { matType: 3, base: [0.02, 0.58, 0.72] });
      } else if (state.outfit === 'mustard') {
        drawMesh(meshes.jacketMustard, outM, { matType: 3, base: [1, 1, 1] });
      } else if (state.outfit === 'boo') {
        drawMesh(meshes.shirtBoo, outM, { matType: 3, base: [1, 1, 1], tex: booTexture });
      } else if (state.outfit === 'orange') {
        drawMesh(meshes.vestOrange, outM, { matType: 3, base: [0.90, 0.35, 0.14] });
      } else if (state.outfit === 'red') {
        drawMesh(meshes.vestRed, outM, { matType: 3, base: [0.74, 0.13, 0.19] });
      } else if (state.outfit === 'harness') {
        drawMesh(meshes.harness, outM, { matType: 3, base: [0.76, 0.11, 0.34] });
      }
    }

    // 4 Fluffy Legs
    const drawLeg = (mesh, x, y, z, pitch, outRoll) => {
      const m = M4.create();
      M4.copy(m, bodyM);
      M4.translate(m, m, x, y, z);
      M4.rotateX(m, m, pitch);
      M4.rotateZ(m, m, outRoll);
      M4.scale(m, m, rig.coatScale, 1, rig.coatScale);
      drawMesh(mesh, m, { matType: 0, base: pal.base, tip: pal.tip, furScale: pal.furScale });
    };
    drawLeg(meshes.legFront, -0.14, -0.07, 0.23, rig.flPitch, -rig.flOut);
    drawLeg(meshes.legFront,  0.14, -0.07, 0.23, rig.frPitch,  rig.frOut);
    drawLeg(meshes.legBack,  -0.15, -0.06, -0.31, rig.blPitch, -rig.blOut);
    drawLeg(meshes.legBack,   0.15, -0.06, -0.31, rig.brPitch,  rig.brOut);

    // Plumed Cloud Tail
    const tailM = M4.create();
    M4.copy(tailM, bodyM);
    M4.translate(tailM, tailM, 0, 0.10, -0.40);
    M4.rotateX(tailM, tailM, rig.tailPitch);
    M4.rotateY(tailM, tailM, wag);
    M4.rotateZ(tailM, tailM, wag * 0.45);
    drawMesh(meshes.tail, tailM, { matType: 0, base: pal.base, tip: pal.tip, furScale: pal.furScale });

    // Head Group
    const headM = M4.create();
    M4.copy(headM, bodyM);
    M4.translate(headM, headM, 0, 0.27, 0.33);
    M4.rotateY(headM, headM, rig.headYaw);
    M4.rotateX(headM, headM, rig.headPitch + targetLookPitch);
    M4.rotateZ(headM, headM, rig.headRoll);
    const babyHeadBoost = state.coat === 'baby2012' ? 1.12 : 1.0;
    M4.scale(headM, headM, babyHeadBoost, babyHeadBoost, babyHeadBoost);

    const headFurM = M4.create();
    M4.copy(headFurM, headM);
    M4.scale(headFurM, headFurM, rig.coatScale, rig.coatScale * 0.99, rig.coatScale);
    drawMesh(meshes.head, headFurM, { matType: 0, base: pal.base, tip: pal.tip, furScale: pal.furScale });
    hitSpheres.head.pos = M4.transformPoint(headM, 0, 0.03, 0.05);

    // Floppy Feathered Ears
    const earBounce = Math.sin(elapsed * 3.4) * 0.03 + (state.petTimer > 0 ? 0.14 : 0) + (state.barkTimer > 0 ? 0.16 : 0);
    for (const s of [-1, 1]) {
      const earM = M4.create();
      M4.copy(earM, headM);
      M4.translate(earM, earM, s * 0.205, 0.122, 0.01);
      M4.rotateZ(earM, earM, s * (0.14 + earBounce + rig.headRoll * 0.35));
      M4.rotateX(earM, earM, -0.06);
      M4.scale(earM, earM, s * rig.earScale, rig.earScale, rig.earScale);
      drawMesh(meshes.ear, earM, { matType: 0, base: pal.base, tip: pal.tip, furScale: pal.furScale });
    }

    // Boopable Heart-Shaped Wet Nose
    const boopSquish = state.boopTimer > 1.05 ? Math.sin(((state.boopTimer - 1.05) / 0.45) * Math.PI) * 0.16 : 0;
    const noseM = M4.create();
    M4.copy(noseM, headM);
    M4.translate(noseM, noseM, 0, -0.012, 0.302 - boopSquish * 0.09);
    M4.scale(noseM, noseM, 1 + boopSquish, 1 - boopSquish * 0.5, 1 - boopSquish);
    drawMesh(meshes.nose, noseM, { matType: 1, base: pal.noseBase, tip: pal.noseTip });
    hitSpheres.nose.pos = M4.transformPoint(headM, 0, -0.012, 0.305);

    // Soulful Glossy Dark Eyes + Blinking Eyelids
    const closeAmt = Math.max(rig.eyeClose, state.blinkVal);
    for (const s of [-1, 1]) {
      const eyeM = M4.create();
      M4.copy(eyeM, headM);
      M4.translate(eyeM, eyeM, s * 0.108, 0.056, 0.200);
      const eyeSz = state.coat === 'baby2012' ? 1.12 : 1.0;
      M4.scale(eyeM, eyeM, eyeSz, eyeSz, eyeSz);
      drawMesh(meshes.eye, eyeM, { matType: 2, base: [0.04, 0.025, 0.02] });

      if (closeAmt > 0.04) {
        const lidM = M4.create();
        M4.copy(lidM, eyeM);
        M4.rotateX(lidM, lidM, lerp(-1.25, 0.18, closeAmt));
        drawMesh(meshes.eyelid, lidM, { matType: 0, base: pal.base, tip: pal.tip, furScale: pal.furScale });
      }
    }

    // Mouth Lip & Tongues
    const jawDrop = (rig.pantAmt * 0.030) + (state.barkTimer > 0 ? Math.abs(Math.sin(state.barkTimer * 18)) * 0.052 : 0) + (state.treat ? 0.024 : 0);
    const lipM = M4.create();
    M4.copy(lipM, headM);
    M4.translate(lipM, lipM, 0, -0.092 - jawDrop, 0.242);
    M4.rotateX(lipM, lipM, jawDrop * 3.5);
    drawMesh(meshes.mouthLip, lipM, { matType: 4, base: [1, 1, 1] });

    if (rig.pantAmt > 0.05 && !state.treat) {
      const tM = M4.create();
      M4.copy(tM, headM);
      const pantBob = Math.sin(elapsed * 9.5) * 0.008;
      M4.translate(tM, tM, 0, -0.088 + pantBob, 0.232);
      M4.scale(tM, tM, rig.pantAmt, rig.pantAmt, rig.pantAmt);
      drawMesh(meshes.tonguePant, tM, { matType: 4, base: [0.88, 0.36, 0.45] });
    }

    if (rig.blepAmt > 0.05 && !state.treat) {
      const bM = M4.create();
      M4.copy(bM, headM);
      M4.translate(bM, bM, 0, -0.072, 0.256);
      const s = rig.blepAmt;
      M4.scale(bM, bM, s, s, s);
      drawMesh(meshes.tongueBlep, bM, { matType: 4, base: [0.89, 0.38, 0.47] });
    }

    if (state.treat) {
      const chewM = M4.create();
      M4.copy(chewM, headM);
      const nibble = Math.sin(elapsed * 11.0) * 0.06;
      M4.translate(chewM, chewM, 0.01, -0.085, 0.252);
      M4.rotateX(chewM, chewM, nibble);
      M4.rotateZ(chewM, chewM, -0.15 + nibble * 0.5);
      drawMesh(meshes.chewStick, chewM, { matType: 4, base: [1, 1, 1] });
    }

    // Stylish Glasses (Frame + Ultra-Clear Crystal Lenses!)
    if (state.glasses) {
      drawMesh(meshes.glassesFrame, headM, { matType: 4, base: [1, 1, 1] });
      gl.depthMask(false);
      drawMesh(meshes.glassesLens, headM, { matType: 5, base: [0.9, 0.95, 1.0] });
      gl.depthMask(true);
    }

    // Floating 3D Hearts
    for (let i = hearts.length - 1; i >= 0; i--) {
      const h = hearts[i];
      h.age += dt;
      if (h.age >= h.life) { hearts.splice(i, 1); continue; }
      h.x += h.vx * dt;
      h.y += h.vy * dt;
      h.z += h.vz * dt;
      const p = h.age / h.life;
      const alpha = p < 0.2 ? p / 0.2 : 1.0 - (p - 0.2) / 0.8;
      const hm = M4.create();
      M4.translate(hm, hm, h.x, h.y, h.z);
      M4.rotateY(hm, hm, cam.yaw + Math.sin(elapsed * 5 + i) * 0.3);
      const sc = h.scale * (0.7 + 0.4 * Math.sin(p * Math.PI));
      M4.scale(hm, hm, sc, sc, sc);
      drawMesh(meshes.heart, hm, { matType: 4, base: h.color, alpha });
    }

    requestAnimationFrame(renderFrame);
  }
  requestAnimationFrame(renderFrame);

  // =========================================================================
  // 9. Pointer Orbit, Zoom & Exact 3D Raycasted Boop/Pet Interactions
  // =========================================================================
  let lastX = 0, lastY = 0, dragMoved = 0;

  function showBubble(text, screenX, screenY) {
    const layer = document.getElementById('reactionLayer');
    const el = document.createElement('div');
    el.className = 'speech-bubble';
    el.style.left = `${screenX}px`;
    el.style.top = `${screenY}px`;
    el.textContent = text;
    layer.appendChild(el);
    setTimeout(() => el.remove(), 1700);
  }

  function setMood(text) {
    document.getElementById('moodBadge').textContent = text;
  }

  function triggerBoop(sx, sy) {
    state.boops++;
    state.boopTimer = 1.5;
    document.getElementById('boopCount').textContent = state.boops;
    setMood('Booped! 🐾');
    spawnHearts(hitSpheres.nose.pos, 5);
    playCuteSound('boop');
    const rect = canvas.getBoundingClientRect();
    showBubble('Boop! 👅', sx ?? rect.width * 0.5, sy ?? rect.height * 0.36);
  }

  function triggerPet(sx, sy) {
    state.pets++;
    state.petTimer = 2.0;
    document.getElementById('petCount').textContent = state.pets;
    setMood('Blissful Pets 💛');
    spawnHearts(hitSpheres.head.pos, 6);
    playCuteSound('pet');
    const rect = canvas.getBoundingClientRect();
    showBubble('Good girl! 💛', sx ?? rect.width * 0.5, sy ?? rect.height * 0.30);
  }

  function triggerBark() {
    state.barkTimer = 0.85;
    setMood('Arf! Arf! 🐾');
    spawnHearts(hitSpheres.head.pos, 3);
    playCuteSound('bark');
    const rect = canvas.getBoundingClientRect();
    const lines = ['Arf! 🐾', 'Woof! 💕', 'Treat pls! 🦴', 'Play? 🧸'];
    showBubble(lines[Math.floor(Math.random() * lines.length)], rect.width * 0.52, rect.height * 0.28);
  }

  function rayHitsSphere(orig, dir, center, r) {
    const ocx = orig[0] - center[0], ocy = orig[1] - center[1], ocz = orig[2] - center[2];
    const b = ocx * dir[0] + ocy * dir[1] + ocz * dir[2];
    const c = ocx * ocx + ocy * ocy + ocz * ocz - r * r;
    const disc = b * b - c;
    if (disc < 0) return -1;
    const t = -b - Math.sqrt(disc);
    return t > 0 ? t : -1;
  }

  function pickAtClient(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const nx = ((clientX - rect.left) / rect.width) * 2 - 1;
    const ny = 1 - ((clientY - rect.top) / rect.height) * 2;
    const unproj = (z) => {
      const x = invVP[0]*nx + invVP[4]*ny + invVP[8]*z + invVP[12];
      const y = invVP[1]*nx + invVP[5]*ny + invVP[9]*z + invVP[13];
      const zz = invVP[2]*nx + invVP[6]*ny + invVP[10]*z + invVP[14];
      const w = invVP[3]*nx + invVP[7]*ny + invVP[11]*z + invVP[15] || 1;
      return [x/w, y/w, zz/w];
    };
    const pNear = unproj(-1);
    const pFar = unproj(1);
    let dx = pFar[0] - pNear[0], dy = pFar[1] - pNear[1], dz = pFar[2] - pNear[2];
    const dl = Math.hypot(dx, dy, dz) || 1;
    const dir = [dx/dl, dy/dl, dz/dl];
    const sx = clientX - rect.left, sy = clientY - rect.top;

    if (rayHitsSphere(pNear, dir, hitSpheres.nose.pos, hitSpheres.nose.r) > 0) { triggerBoop(sx, sy); return; }
    if (rayHitsSphere(pNear, dir, hitSpheres.head.pos, hitSpheres.head.r) > 0) { triggerPet(sx, sy); return; }
    if (state.plushie && rayHitsSphere(pNear, dir, hitSpheres.pooh.pos, hitSpheres.pooh.r) > 0) {
      state.plushBounce = 1.0; playCuteSound('boop'); showBubble('Squeak! 🧸', sx, sy); return;
    }
    if (rayHitsSphere(pNear, dir, hitSpheres.body.pos, hitSpheres.body.r) > 0) { triggerPet(sx, sy); }
  }

  canvas.addEventListener('pointerdown', (e) => {
    isDragging = true;
    lastX = e.clientX; lastY = e.clientY; dragMoved = 0;
    canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener('pointermove', (e) => {
    const rect = canvas.getBoundingClientRect();
    cam.pointerX = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    cam.pointerY = ((e.clientY - rect.top) / rect.height) * 2 - 1;
    cam.hovering = true;
    if (!isDragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    dragMoved += Math.hypot(dx, dy);
    cam.goalYaw -= dx * 0.0085;
    cam.goalPitch = clamp(cam.goalPitch + dy * 0.0068, -0.18, 1.15);
  });

  canvas.addEventListener('pointerup', (e) => {
    if (isDragging && dragMoved < 7) pickAtClient(e.clientX, e.clientY);
    isDragging = false;
  });
  canvas.addEventListener('pointerleave', () => { cam.hovering = false; });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    cam.goalDist = clamp(cam.goalDist + e.deltaY * 0.0022, 1.35, 5.2);
  }, { passive: false });

  // =========================================================================
  // 10. UI Binding & Studio Controls
  // =========================================================================
  function styleRadioGroup(containerId, attr, currentVal) {
    document.querySelectorAll(`#${containerId} button`).forEach((b) => {
      b.classList.toggle('is-active', b.getAttribute(attr) === currentVal);
    });
  }

  function styleToggleBtn(id, active) {
    const b = document.getElementById(id);
    b.classList.toggle('is-active', active);
    const dot = b.querySelector('.state-dot');
    if (dot) dot.textContent = active ? 'On' : 'Off';
  }

  function refreshUI() {
    styleRadioGroup('poseGroup', 'data-pose', state.pose);
    styleRadioGroup('exprGroup', 'data-expr', state.expr);
    styleRadioGroup('coatGroup', 'data-coat', state.coat);
    styleRadioGroup('outfitGroup', 'data-outfit', state.outfit);
    styleRadioGroup('lightGroup', 'data-light', state.lighting);
    styleToggleBtn('togGlasses', state.glasses);
    styleToggleBtn('togPlushie', state.plushie);
    styleToggleBtn('togCushion', state.cushion);
    styleToggleBtn('togTreat', state.treat);
    document.getElementById('spinToggleBtn').textContent = state.autoSpin ? 'Spin: On' : 'Spin: Off';
    document.getElementById('actSound').textContent = state.soundOn ? '🔊' : '🔈';
  }

  document.querySelectorAll('#poseGroup button').forEach(b => b.addEventListener('click', () => {
    state.pose = b.getAttribute('data-pose');
    setMood({ stand: 'Ready to Walk', sit: 'Good Girl Sitting', lounge: 'Cozy Cushion Nap', playful: 'Playtime!' }[state.pose]);
    refreshUI();
  }));
  document.querySelectorAll('#exprGroup button').forEach(b => b.addEventListener('click', () => { state.expr = b.getAttribute('data-expr'); refreshUI(); }));
  document.querySelectorAll('#coatGroup button').forEach(b => b.addEventListener('click', () => {
    state.coat = b.getAttribute('data-coat');
    setMood(state.coat === 'baby2012' ? 'Sept 2012 Puppy 💛' : 'Freshly Fluffed ✨');
    refreshUI();
  }));
  document.querySelectorAll('#outfitGroup button').forEach(b => b.addEventListener('click', () => { state.outfit = b.getAttribute('data-outfit'); refreshUI(); }));
  document.querySelectorAll('#lightGroup button').forEach(b => b.addEventListener('click', () => { state.lighting = b.getAttribute('data-light'); refreshUI(); }));

  document.getElementById('togGlasses').addEventListener('click', () => { state.glasses = !state.glasses; refreshUI(); });
  document.getElementById('togPlushie').addEventListener('click', () => { state.plushie = !state.plushie; refreshUI(); });
  document.getElementById('togCushion').addEventListener('click', () => { state.cushion = !state.cushion; refreshUI(); });
  document.getElementById('togTreat').addEventListener('click', () => {
    state.treat = !state.treat;
    if (state.treat) setMood('Munching Treat 🥩');
    refreshUI();
  });

  document.getElementById('actBoop').addEventListener('click', () => triggerBoop());
  document.getElementById('actPet').addEventListener('click', () => triggerPet());
  document.getElementById('actTreat').addEventListener('click', () => {
    state.treat = !state.treat;
    if (state.treat) {
      setMood('Yummy Jerky! 🥩');
      spawnHearts(hitSpheres.head.pos, 4);
      const rect = canvas.getBoundingClientRect();
      showBubble('Nom nom! 🥩', rect.width * 0.5, rect.height * 0.34);
    }
    refreshUI();
  });
  document.getElementById('actBark').addEventListener('click', triggerBark);
  document.getElementById('actSound').addEventListener('click', () => {
    state.soundOn = !state.soundOn;
    if (state.soundOn) playCuteSound('boop');
    refreshUI();
  });

  document.getElementById('camFaceBtn').addEventListener('click', () => {
    cam.goalYaw = 0.22; cam.goalPitch = 0.14; cam.goalDist = 1.65; cam.goalTargetY = 0.90;
  });
  document.getElementById('camFullBtn').addEventListener('click', () => {
    cam.goalYaw = 0.36; cam.goalPitch = 0.20; cam.goalDist = 3.05; cam.goalTargetY = 0.72;
  });
  document.getElementById('spinToggleBtn').addEventListener('click', () => { state.autoSpin = !state.autoSpin; refreshUI(); });
  document.getElementById('resetAllBtn').addEventListener('click', () => {
    state.pose = 'sit'; state.expr = 'sweet'; state.coat = 'shaggy';
    state.outfit = 'none'; state.glasses = false; state.plushie = true;
    state.cushion = true; state.treat = false; state.lighting = 'balcony';
    state.autoSpin = false;
    cam.goalYaw = 0.36; cam.goalPitch = 0.20; cam.goalDist = 3.05; cam.goalTargetY = 0.72;
    setMood('Happy & Wagging');
    refreshUI();
  });

  
  // Mobile two-finger pinch zoom
  let pinchStartDist = 0, pinchStartCam = 0;
  canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      pinchStartDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      pinchStartCam = cam.goalDist;
    }
  }, { passive: true });
  canvas.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2 && pinchStartDist > 0) {
      const d = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      cam.goalDist = clamp(pinchStartCam * (pinchStartDist / Math.max(10, d)), 1.35, 5.2);
    }
  }, { passive: true });

  refreshUI();
})();
</script>
